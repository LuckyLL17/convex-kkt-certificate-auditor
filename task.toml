schema_version = "1.3"
allow_internet = true

[task]
name = "local/convex-kkt-certificate-auditor"
version = "1.0.0"
description = "带下界约束的凸二次模型 KKT 证书审计器"
authors = [{ name = "xyj" }]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
dockerfile = "environment/Dockerfile"
network_mode = "public"
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[metadata]
category = "mathematics"
subcategory = "numerical_optimization"
tags = ["convex-optimization", "kkt", "numerical-analysis", "python"]
expert_time_estimate_hours = 4.0
